<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>我的 Cursor · 桌面智能体</title>
  <style>
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --border: #e3e6ea; --text: #1f2329;
      --muted: #8a919e; --accent: #2f6fed; --accent-soft: #eaf1ff;
      --red: #d83a3a; --red-soft: #fdecec; --green: #1f9d55; --green-soft: #e9f7ef;
      --code-bg: #f0f2f5; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg); color: var(--text); display: flex; flex-direction: column;
    }
    header {
      display: flex; gap: 10px; align-items: center; padding: 10px 14px;
      background: var(--panel); border-bottom: 1px solid var(--border);
    }
    header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
    #status { font-size: 12px; color: var(--muted); margin-left: auto; }
    #status.ok { color: var(--green); } #status.bad { color: var(--red); }
    #task { flex: 1; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; }
    button { padding: 8px 14px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--panel); cursor: pointer; font-size: 13px; }
    button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    button.danger { color: var(--red); border-color: var(--red); }

    main { flex: 1; display: grid; grid-template-columns: 240px 1fr 360px; gap: 1px;
      background: var(--border); min-height: 0; overflow: hidden; }
    .col { background: var(--panel); display: flex; flex-direction: column;
      min-height: 0; min-width: 0; overflow: hidden; }
    .col > .head { padding: 8px 12px; font-size: 12px; font-weight: 600; color: var(--muted);
      border-bottom: 1px solid var(--border); letter-spacing: .5px; flex: 0 0 auto; }
    .scroll { flex: 1 1 auto; overflow: auto; padding: 10px 12px; min-height: 0; }

    /* 文件树 */
    .tree-item { padding: 3px 4px; font-size: 13px; cursor: pointer; border-radius: 5px; white-space: nowrap; }
    .tree-item:hover { background: var(--accent-soft); }
    .tree-children { padding-left: 14px; }
    .tree-file::before { content: "📄 "; } .tree-dir::before { content: "📁 "; }

    /* 文件预览：固定在下半栏，内容自己滚，绝不撑破父容器 */
    #preview { flex: 0 0 auto; max-height: 46%; min-height: 0; overflow: hidden;
      display: none; flex-direction: column; border-top: 1px solid var(--border); }
    #preview.on { display: flex; }
    #preview .phead { flex: 0 0 auto; padding: 6px 12px; font-size: 11px; color: var(--muted);
      border-bottom: 1px solid var(--border); white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; }
    #preview .phead.err { color: var(--red); }
    #preview pre { flex: 1 1 auto; min-height: 0; margin: 0; padding: 8px 10px;
      background: var(--code-bg); font-family: var(--mono); font-size: 12px;
      white-space: pre; overflow: auto; tab-size: 4; }

    /* 对话/工具流 */
    .ev { margin-bottom: 10px; font-size: 13px; line-height: 1.5; }
    .ev.system { color: var(--muted); font-size: 12px; }
    .ev.step { color: var(--muted); font-size: 11px; border-top: 1px dashed var(--border);
      padding-top: 6px; margin-top: 4px; }
    .ev.msg { background: var(--accent-soft); padding: 8px 10px; border-radius: 8px; white-space: pre-wrap; }
    .ev.final { background: #fff7e0; border: 1px solid #f0d98a; padding: 10px; border-radius: 8px; white-space: pre-wrap; font-weight: 500; }
    .ev.action { background: var(--code-bg); padding: 8px 10px; border-radius: 8px; }
    .ev.action .badge { font-size: 10px; padding: 1px 6px; border-radius: 10px; margin-left: 6px; }
    .badge.builtin { background: var(--accent-soft); color: var(--accent); }
    .badge.mcp { background: #efeaff; color: #6b4bd8; }
    .ev.action code { font-family: var(--mono); font-size: 12px; }
    .ev.obs { padding: 6px 10px; border-left: 3px solid var(--green); background: var(--green-soft);
      border-radius: 0 8px 8px 0; white-space: pre-wrap; font-family: var(--mono); font-size: 12px; }
    .ev.obs.err { border-left-color: var(--red); background: var(--red-soft); color: #8a1f1f; }
    .ev.note { color: var(--muted); font-style: italic; }

    /* 终端 */
    #terminal .term-line { font-family: var(--mono); font-size: 12px; margin-bottom: 8px; }
    #terminal .cmd { color: var(--accent); }
    #terminal .out { white-space: pre-wrap; background: var(--code-bg); padding: 6px 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>🛠 我的 Cursor</h1>
    <input id="task" placeholder="给智能体一个任务，例如：stats.py 里 mean 对空列表处理有问题，改掉并跑测试" />
    <button id="send" class="primary">发送</button>
    <button id="stop" class="danger" disabled>中断</button>
    <span id="status">连接中…</span>
  </header>

  <main>
    <section class="col">
      <div class="head">资源管理器</div>
      <div class="scroll" id="tree"></div>
      <div id="preview"></div>
    </section>

    <section class="col">
      <div class="head">对话 · 工具调用</div>
      <div class="scroll" id="chat"></div>
    </section>

    <section class="col">
      <div class="head">终端（bash 输出）</div>
      <div class="scroll" id="terminal"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
